<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrones de prueba CRT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; position:fixed; inset:0; image-rendering:pixelated; }

  #panel {
    position:fixed; top:0; left:0; z-index:10;
    background:rgba(4,4,4,.94);
    border-right:1px solid #2a2418; border-bottom:1px solid #2a2418;
    color:#b8934e;
    font:12px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    padding:14px 18px 15px; max-width:340px;
    letter-spacing:.02em;
  }
  #panel.oculto { display:none; }

  #nombre { color:#e0b566; font-size:14px; font-weight:600; letter-spacing:.04em; }
  #indice { color:#6b5730; font-size:11px; margin-bottom:9px; }
  #nota { color:#8a7440; font-size:11px; margin:9px 0 11px; line-height:1.45; }

  .datos { border-top:1px solid #2a2418; padding-top:9px; margin-bottom:10px; }
  .fila { display:flex; justify-content:space-between; gap:16px; }
  .fila span:last-child { color:#e0b566; }
  .alerta span:last-child { color:#d1633f; }

  .campos { border-top:1px solid #2a2418; padding-top:9px; margin-bottom:10px;
            display:flex; gap:14px; }
  label { color:#6b5730; font-size:11px; display:block; }
  input {
    width:64px; margin-top:3px; background:#0d0b07; color:#e0b566;
    border:1px solid #2a2418; padding:3px 5px;
    font:12px ui-monospace,Menlo,monospace;
  }
  input:focus { outline:1px solid #b8934e; }

  #teclas { border-top:1px solid #2a2418; padding-top:9px;
            color:#6b5730; font-size:11px; line-height:1.65; }
  kbd { color:#b8934e; }
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<div id="panel">
  <div id="nombre"></div>
  <div id="indice"></div>
  <div id="nota"></div>

  <div class="datos">
    <div class="fila"><span>Resolución</span><span id="res">—</span></div>
    <div class="fila"><span>Refresco medido</span><span id="fps">midiendo…</span></div>
    <div id="f-periodo" class="fila"><span>Píxeles por ciclo</span><span id="periodo">—</span></div>
    <div id="f-cpd" class="fila"><span>Frecuencia espacial</span><span id="cpd">—</span></div>
    <div id="f-vel" class="fila"><span>Velocidad</span><span id="vel">—</span></div>
  </div>

  <div class="campos">
    <label>Ancho activo (mm)<input id="ancho" type="number" value="355" min="50" step="1"></label>
    <label>Distancia (cm)<input id="dist" type="number" value="100" min="10" step="1"></label>
  </div>

  <div id="teclas">
    <kbd>← →</kbd> cambiar patrón · <kbd>1-9</kbd> acceso directo<br>
    <kbd>↑ ↓</kbd> frecuencia · <kbd>, .</kbd> velocidad<br>
    <kbd>Espacio</kbd> deriva · <kbd>O</kbd> orientación<br>
    <kbd>H</kbd> ocultar panel · <kbd>F</kbd> pantalla completa
  </div>
</div>

<script>
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d', { alpha:false });
let W = 0, H = 0;

// ---- Estado ----
let patron = 0;
let periodoPx = 16;      // píxeles por ciclo de la rejilla
let derivando = false;
let velPxFrame = 0.5;    // desplazamiento por cuadro
let fase = 0;
let vertical = true;     // barras verticales -> movimiento horizontal

// ---- Patrones ----
// Cada uno declara si necesita animación y qué datos mostrar.
const patrones = [
  { n:'Geometría',            nota:'Comprueba pincushion, trapecio, rotación y linealidad. Los círculos deben ser redondos y las líneas del borde rectas y paralelas al marco.', f:geometria },
  { n:'Convergencia · rejilla', nota:'Busca franjas rojas o azules en los bordes de las líneas. Aumentan hacia las esquinas: ahí es donde se ve la misconvergencia.', f:rejillaFina },
  { n:'Convergencia · puntos',  nota:'Cada punto debe ser blanco y limpio. Si se ve como tres puntos R/G/B separados, hay misconvergencia.', f:puntos },
  { n:'Blanco pleno',         nota:'Uniformidad de luminancia. Compara centro contra las cuatro esquinas. Un tubo gastado cae de brillo en los bordes.', f:()=>plano(255,255,255) },
  { n:'Rojo pleno',           nota:'Prueba de pureza. Manchas o zonas apagadas indican magnetización: desmagnetiza y repite.', f:()=>plano(255,0,0) },
  { n:'Verde pleno',          nota:'Prueba de pureza sobre el fósforo verde.', f:()=>plano(0,255,0) },
  { n:'Azul pleno',           nota:'Prueba de pureza sobre el fósforo azul. Suele ser el más revelador.', f:()=>plano(0,0,255) },
  { n:'Negro pleno',          nota:'Nivel de negro y retorno de haz. No deben verse líneas de retrazado ni un fondo grisáceo. A oscuras, con brillo al máximo.', f:()=>plano(0,0,0) },
  { n:'Escalones de gris',    nota:'Linealidad. Los 16 escalones deben distinguirse todos, incluidos los dos más oscuros. Referencia previa a calibrar gamma.', f:escalones },
  { n:'Rampa continua',       nota:'Busca bandas o saltos bruscos en la transición. Delatan no linealidad del amplificador de vídeo.', f:rampa },
  { n:'Líneas de 1 px',       nota:'Ancho de banda y foco. Si las líneas se funden en gris uniforme, el ancho de banda no llega a esta resolución.', f:lineas1px },
  { n:'Damero de 1 px',       nota:'La prueba más exigente de foco. Ajusta S-Focus y D-Focus del FBT contra este patrón.', f:damero },
  { n:'Rejilla sinusoidal',   nota:'Tu estímulo. Ajusta la frecuencia y activa la deriva para verificar que no aparece aliasing temporal ni tirones a la velocidad de trabajo.', f:sinusoidal, grating:true }
];

// ---- Dibujo ----
function plano(r,g,b){ ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,H); }

function geometria(){
  plano(0,0,0);
  const paso = Math.round(Math.min(W,H)/16);
  const ox = Math.round((W % paso)/2), oy = Math.round((H % paso)/2);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x <= W; x += paso){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); }
  for (let y = oy; y <= H; y += paso){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); }
  ctx.stroke();
  // Marco exacto en el borde del área activa
  ctx.strokeRect(.5,.5,W-1,H-1);
  // Círculos de referencia: si el tubo deforma, dejan de ser redondos
  const cx = W/2, cy = H/2, r = Math.min(W,H)*0.45;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,r/2,0,6.2832); ctx.stroke();
}

function rejillaFina(){
  plano(0,0,0);
  const paso = 8;
  const img = ctx.createImageData(W,H); const d = img.data;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const on = (x % paso === 0) || (y % paso === 0);
      const i = (y*W+x)*4;
      d[i]=d[i+1]=d[i+2] = on ? 255 : 0; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

function puntos(){
  plano(0,0,0);
  const paso = 32;
  const img = ctx.createImageData(W,H); const d = img.data;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const on = (x % paso === 0) && (y % paso === 0);
      const i = (y*W+x)*4;
      d[i]=d[i+1]=d[i+2] = on ? 255 : 0; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

function escalones(){
  const n = 16, w = W/n;
  for (let i=0; i<n; i++){
    const v = Math.round(i*255/(n-1));
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(Math.round(i*w), 0, Math.ceil(w)+1, H);
  }
}

function rampa(){
  const img = ctx.createImageData(W,H); const d = img.data;
  for (let x=0; x<W; x++){
    const v = Math.round(x*255/(W-1));
    for (let y=0; y<H; y++){
      const i = (y*W+x)*4;
      d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

function lineas1px(){
  const img = ctx.createImageData(W,H); const d = img.data;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const on = vertical ? (x & 1) === 0 : (y & 1) === 0;
      const i = (y*W+x)*4;
      d[i]=d[i+1]=d[i+2] = on ? 255 : 0; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

function damero(){
  const img = ctx.createImageData(W,H); const d = img.data;
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const on = ((x ^ y) & 1) === 0;
      const i = (y*W+x)*4;
      d[i]=d[i+1]=d[i+2] = on ? 255 : 0; d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

// La rejilla se genera como una sola fila (o columna) y se repite:
// evita recalcular toda la pantalla en cada cuadro durante la deriva.
function sinusoidal(){
  const largo = vertical ? W : H;
  const off = document.createElement('canvas');
  off.width  = vertical ? largo : 1;
  off.height = vertical ? 1 : largo;
  const octx = off.getContext('2d');
  const img = octx.createImageData(off.width, off.height);
  const d = img.data;
  for (let k=0; k<largo; k++){
    const v = Math.round(127.5 * (1 + Math.sin(2*Math.PI*(k + fase)/periodoPx)));
    const i = k*4;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  octx.putImageData(img,0,0);
  const pat = ctx.createPattern(off,'repeat');
  ctx.fillStyle = pat;
  ctx.fillRect(0,0,W,H);
}

// ---- Bucle ----
function dibujar(){ patrones[patron].f(); }

let ultimo = performance.now(), muestras = [], hz = 0;
function bucle(t){
  const dt = t - ultimo; ultimo = t;
  if (dt > 1 && dt < 100){
    muestras.push(dt);
    if (muestras.length > 120) muestras.shift();
    if (muestras.length >= 30){
      const ord = [...muestras].sort((a,b)=>a-b);
      hz = 1000 / ord[Math.floor(ord.length/2)];   // mediana: resiste cuadros perdidos
    }
  }
  if (derivando && patrones[patron].grating){
    fase += velPxFrame;
    dibujar();
  }
  actualizarPanel();
  requestAnimationFrame(bucle);
}

// ---- Panel ----
const $ = id => document.getElementById(id);

function actualizarPanel(){
  const p = patrones[patron];
  $('nombre').textContent = p.n;
  $('indice').textContent = `patrón ${patron+1} de ${patrones.length}`;
  $('nota').textContent = p.nota;
  $('res').textContent = `${W} × ${H}`;
  $('fps').textContent = hz ? `${hz.toFixed(1)} Hz` : 'midiendo…';

  const esRejilla = !!p.grating;
  $('f-periodo').style.display = esRejilla ? 'flex' : 'none';
  $('f-cpd').style.display     = esRejilla ? 'flex' : 'none';
  $('f-vel').style.display     = esRejilla ? 'flex' : 'none';
  if (!esRejilla) return;

  $('periodo').textContent = `${periodoPx}`;
  // Menos de 4 px/ciclo introduce armónicos de cuantización apreciables
  $('f-periodo').classList.toggle('alerta', periodoPx < 4);

  const anchoMm = parseFloat($('ancho').value) || 355;
  const distMm  = (parseFloat($('dist').value) || 100) * 10;
  const pxPorMm = W / anchoMm;
  const cicloMm = periodoPx / pxPorMm;
  const gradosPorCiclo = 2 * Math.atan(cicloMm/2 / distMm) * 180 / Math.PI;
  const cpd = 1 / gradosPorCiclo;
  $('cpd').textContent = `${cpd.toFixed(2)} c/grado`;

  if (derivando && hz){
    const gradosSeg = velPxFrame * hz / pxPorMm / (distMm * Math.PI/180);
    const hzTemp = cpd * gradosSeg;
    $('vel').textContent = `${gradosSeg.toFixed(2)} °/s · ${hzTemp.toFixed(1)} Hz`;
    // Por encima de 1/4 de ciclo por cuadro aparece aliasing temporal
    $('f-vel').classList.toggle('alerta', velPxFrame > periodoPx/4);
  } else {
    $('vel').textContent = 'detenida';
    $('f-vel').classList.remove('alerta');
  }
}

// ---- Entrada ----
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k === 'ArrowRight'){ patron = (patron+1) % patrones.length; dibujar(); }
  else if (k === 'ArrowLeft'){ patron = (patron-1+patrones.length) % patrones.length; dibujar(); }
  else if (k >= '1' && k <= '9'){ patron = Math.min(+k-1, patrones.length-1); dibujar(); }
  else if (k === 'ArrowUp'){ periodoPx = Math.min(512, periodoPx+1); dibujar(); }
  else if (k === 'ArrowDown'){ periodoPx = Math.max(2, periodoPx-1); dibujar(); }
  else if (k === '.'){ velPxFrame = Math.min(64, +(velPxFrame+0.25).toFixed(2)); }
  else if (k === ','){ velPxFrame = Math.max(0.25, +(velPxFrame-0.25).toFixed(2)); }
  else if (k === ' '){ derivando = !derivando; dibujar(); }
  else if (k === 'o' || k === 'O'){ vertical = !vertical; dibujar(); }
  else if (k === 'h' || k === 'H'){ $('panel').classList.toggle('oculto'); }
  else if (k === 'f' || k === 'F'){
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  } else return;
  e.preventDefault();
});

['ancho','dist'].forEach(id => $(id).addEventListener('input', actualizarPanel));

function redimensionar(){
  // Sin escalado por devicePixelRatio: los patrones deben ser exactos al píxel.
  W = lienzo.width  = Math.round(innerWidth);
  H = lienzo.height = Math.round(innerHeight);
  ctx.imageSmoothingEnabled = false;
  dibujar();
}
addEventListener('resize', redimensionar);

redimensionar();
requestAnimationFrame(bucle);
</script>
</body>
</html>
