<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Patrones CRT</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  canvas {
    display:block; position:fixed; inset:0; width:100%; height:100%;
    image-rendering:pixelated; touch-action:none;
  }

  :root {
    --ambar:#e0b566; --ambar-medio:#b8934e; --ambar-tenue:#6b5730;
    --borde:#2a2418; --fondo:rgba(5,4,3,.95); --alerta:#d1633f;
    --mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  .ui { transition:opacity .18s ease; }
  .ui.oculto { opacity:0; pointer-events:none; }

  #panel {
    position:fixed; z-index:10; top:env(safe-area-inset-top); left:0;
    background:var(--fondo);
    border-right:1px solid var(--borde); border-bottom:1px solid var(--borde);
    color:var(--ambar-medio); font:12px/1.5 var(--mono);
    padding:13px 16px 14px; width:316px; max-width:88vw;
    max-height:calc(100vh - 110px); overflow-y:auto; letter-spacing:.02em;
  }
  #nombre { color:var(--ambar); font-size:14px; font-weight:600; letter-spacing:.04em; }
  #nota { color:#8a7440; font-size:11px; margin:5px 0 11px; line-height:1.45; }

  .bloque { border-top:1px solid var(--borde); padding-top:8px; margin-bottom:9px; }
  .fila { display:flex; justify-content:space-between; gap:14px; }
  .fila span:last-child { color:var(--ambar); }
  .fila.alerta span:last-child { color:var(--alerta); }
  .fila.calc span:last-child { color:var(--ambar-medio); }

  .ajustes { border-top:1px solid var(--borde); padding-top:8px; }
  label { color:var(--ambar-tenue); font-size:11px; display:block; margin-bottom:7px; }
  select, input {
    width:100%; margin-top:3px; background:#0d0b07; color:var(--ambar);
    border:1px solid var(--borde); border-radius:4px; padding:5px 6px;
    font:12px var(--mono);
  }
  select:focus, input:focus { outline:1px solid var(--ambar-medio); }
  .par { display:flex; gap:10px; }
  .par label { flex:1; }

  #teclas {
    border-top:1px solid var(--borde); margin-top:4px; padding-top:8px;
    color:var(--ambar-tenue); font-size:10px; line-height:1.7;
  }
  kbd { color:var(--ambar-medio); }

  #nav {
    position:fixed; z-index:20; left:0; right:0;
    bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; align-items:center; gap:12px;
    pointer-events:none;
  }
  #nav button {
    pointer-events:auto; background:rgba(5,4,3,.92); color:var(--ambar-medio);
    border:1px solid var(--borde); border-radius:10px;
    font:600 22px/1 var(--mono); width:72px; height:56px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #nav button:active { background:#241d10; color:var(--ambar); }
  #cuenta { color:var(--ambar-tenue); font:11px var(--mono); min-width:52px; text-align:center; }

  @media (max-width:760px) { #teclas { display:none; } }
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<div id="panel" class="ui">
  <div id="nombre"></div>
  <div id="nota"></div>

  <div class="bloque">
    <div class="fila"><span>Lienzo</span><span id="m-lienzo">—</span></div>
    <div class="fila"><span>Refresco</span><span id="m-fps">midiendo…</span></div>
    <div class="fila calc"><span>Área activa</span><span id="m-area">—</span></div>
    <div class="fila calc"><span>Píxeles por grado</span><span id="m-ppg">—</span></div>
  </div>

  <div class="bloque" id="b-rejilla">
    <div class="fila"><span>Frecuencia espacial</span><span id="m-cpd">—</span></div>
    <div class="fila"><span>Frecuencia temporal</span><span id="m-hz">—</span></div>
    <div class="fila calc" id="f-per"><span>Píxeles por ciclo</span><span id="m-per">—</span></div>
    <div class="fila calc" id="f-vel"><span>Velocidad</span><span id="m-vel">—</span></div>
  </div>

  <div class="ajustes">
    <div class="par">
      <label>Ancho activo (mm)<input id="ancho" type="number" inputmode="decimal" value="365" min="20" step="1"></label>
      <label>Distancia (cm)<input id="dist" type="number" inputmode="decimal" value="100" min="10" step="1"></label>
    </div>
  </div>

  <div id="teclas">
    <kbd>← →</kbd> patrón · <kbd>1-9</kbd> directo<br>
    <kbd>↑ ↓</kbd> c/grado · <kbd>, .</kbd> Hz · <kbd>Espacio</kbd> deriva<br>
    <kbd>O</kbd> orientación · <kbd>H</kbd> panel · <kbd>F</kbd> pantalla completa
  </div>
</div>

<div id="nav" class="ui">
  <button id="ant" aria-label="Anterior">‹</button>
  <span id="cuenta"></span>
  <button id="sig" aria-label="Siguiente">›</button>
</div>

<script>
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d', { alpha:false });
const $ = id => document.getElementById(id);
let W = 0, H = 0;

// Área activa 365 × 274 mm, válida para los dos: son tubos de 19" de la
// misma clase. El Philips la documenta; en el Hitachi se deduce de la
// carcasa (448 mm) y del paso de 0.22 mm con 1600 puntos.
const ALTO_ANCHO = 274/365;

let patron = 0;
let cpdObjetivo = 1;      // ciclos por grado
let freqTemporal = 4;     // ciclos por segundo
let derivando = true;
let vertical = true;
let periodoPx = 32;
let fase = 0;

// ---------- Patrones ----------
function plano(r,g,b){ ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,H); }

function porPixel(test){
  const img = ctx.createImageData(W,H), d = img.data;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const i=(y*W+x)*4;
    d[i]=d[i+1]=d[i+2] = test(x,y) ? 255 : 0; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}

function geometria(){
  plano(0,0,0);
  const paso = Math.max(20, Math.round(Math.min(W,H)/16));
  const ox = Math.round((W%paso)/2), oy = Math.round((H%paso)/2);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1;
  ctx.beginPath();
  for (let x=ox; x<=W; x+=paso){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); }
  for (let y=oy; y<=H; y+=paso){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); }
  ctx.stroke();
  ctx.strokeRect(.5,.5,W-1,H-1);
  const r = Math.min(W,H)*0.45;
  ctx.beginPath(); ctx.arc(W/2,H/2,r,0,6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,r/2,0,6.2832); ctx.stroke();
}

function rejillaFina(){ porPixel((x,y) => x%8===0 || y%8===0); }
function puntos(){      porPixel((x,y) => x%32===0 && y%32===0); }
function lineas1px(){   porPixel((x,y) => vertical ? (x&1)===0 : (y&1)===0); }
function damero(){      porPixel((x,y) => ((x^y)&1)===0); }

function escalones(){
  const n=16, w=W/n;
  for (let i=0;i<n;i++){
    const v = Math.round(i*255/(n-1));
    ctx.fillStyle=`rgb(${v},${v},${v})`;
    ctx.fillRect(Math.round(i*w),0,Math.ceil(w)+1,H);
  }
}

function rampa(){
  const img=ctx.createImageData(W,H), d=img.data;
  for (let x=0;x<W;x++){
    const v=Math.round(x*255/(W-1));
    for (let y=0;y<H;y++){ const i=(y*W+x)*4; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  }
  ctx.putImageData(img,0,0);
}

// Una fila (o columna) repetida: la deriva no recalcula toda la pantalla.
function sinusoidal(){
  const largo = vertical ? W : H;
  const off = document.createElement('canvas');
  off.width  = vertical ? largo : 1;
  off.height = vertical ? 1 : largo;
  const octx = off.getContext('2d');
  const img = octx.createImageData(off.width, off.height), d = img.data;
  for (let k=0;k<largo;k++){
    const v = Math.round(127.5*(1+Math.sin(2*Math.PI*(k+fase)/periodoPx)));
    const i=k*4; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.fillStyle = ctx.createPattern(off,'repeat');
  ctx.fillRect(0,0,W,H);
}

const patrones = [
  { n:'Geometría',      nota:'Círculos redondos. Bordes rectos y paralelos al marco.', f:geometria },
  { n:'Convergencia',   nota:'Sin franjas rojas ni azules. Mirar las esquinas.', f:rejillaFina },
  { n:'Convergencia · puntos', nota:'Puntos blancos, no tríos R/G/B.', f:puntos },
  { n:'Blanco',         nota:'Mismo brillo en el centro que en las esquinas.', f:()=>plano(255,255,255) },
  { n:'Rojo',           nota:'Sin manchas. Si las hay, desmagnetizar.', f:()=>plano(255,0,0) },
  { n:'Verde',          nota:'Sin manchas.', f:()=>plano(0,255,0) },
  { n:'Azul',           nota:'Sin manchas. El más revelador.', f:()=>plano(0,0,255) },
  { n:'Negro',          nota:'A oscuras. Sin líneas de retrazado ni fondo gris.', f:()=>plano(0,0,0) },
  { n:'Escalones',      nota:'Los 16 distinguibles, también los dos primeros.', f:escalones },
  { n:'Rampa',          nota:'Sin bandas ni saltos.', f:rampa },
  { n:'Líneas de 1 px', nota:'Si se separan, hay ancho de banda de sobra.', f:lineas1px },
  { n:'Damero de 1 px', nota:'Ajustar foco contra esto.', f:damero },
  { n:'Rejilla sinusoidal', nota:'1 c/grado a 4 Hz. Sin tirones ni aliasing.', f:sinusoidal, grating:true }
];

function dibujar(){ patrones[patron].f(); }

// ---------- Métrica ----------
// El ancho es el del área activa del tubo: el lienzo debe ocuparla entera,
// es decir, en pantalla completa y con el H.SIZE del OSD al máximo.
function metrica(){
  const anchoMm = parseFloat($('ancho').value) || 365;
  const altoMm  = anchoMm * ALTO_ANCHO;
  const distMm  = (parseFloat($('dist').value) || 100) * 10;
  const pxPorMm = W / anchoMm;
  const mmPorGrado = 2 * distMm * Math.tan(0.5 * Math.PI/180);
  return { anchoMm, altoMm, distMm, pxPorMm, pxPorGrado: pxPorMm * mmPorGrado };
}

function recalcularPeriodo(){
  periodoPx = Math.max(2, metrica().pxPorGrado / cpdObjetivo);
}

// ---------- Bucle ----------
let ultimo = performance.now(), muestras = [], hz = 0;
function bucle(t){
  const dt = t-ultimo; ultimo = t;
  if (dt>1 && dt<100){
    muestras.push(dt);
    if (muestras.length>120) muestras.shift();
    if (muestras.length>=30){
      const ord=[...muestras].sort((a,b)=>a-b);
      hz = 1000/ord[Math.floor(ord.length/2)];   // mediana: resiste cuadros perdidos
    }
  }
  if (derivando && patrones[patron].grating){
    // Fase por tiempo, no por cuadro: la frecuencia temporal es exacta
    // aunque el refresco varíe o se pierdan cuadros.
    fase = freqTemporal * periodoPx * (t/1000);
    dibujar();
  }
  refrescarDatos();
  requestAnimationFrame(bucle);
}

// ---------- Panel ----------
function pintarUI(){
  const p = patrones[patron];
  $('nombre').textContent = p.n;
  $('nota').textContent = p.nota;
  $('cuenta').textContent = `${patron+1} / ${patrones.length}`;
  $('b-rejilla').style.display = p.grating ? 'block' : 'none';
}

function refrescarDatos(){
  const { anchoMm, altoMm, pxPorGrado } = metrica();
  $('m-lienzo').textContent = `${W} × ${H} px`;
  $('m-fps').textContent = hz ? `${hz.toFixed(1)} Hz` : 'midiendo…';
  $('m-area').textContent = `${anchoMm.toFixed(0)} × ${altoMm.toFixed(0)} mm`;
  $('m-ppg').textContent = `${pxPorGrado.toFixed(1)} px/°`;
  if (!patrones[patron].grating) return;

  $('m-cpd').textContent = `${cpdObjetivo.toFixed(2)} c/grado`;
  $('m-hz').textContent  = `${freqTemporal.toFixed(1)} Hz`;
  $('m-per').textContent = periodoPx.toFixed(1);
  $('f-per').classList.toggle('alerta', periodoPx < 4);   // armónicos de cuantización

  $('m-vel').textContent = `${(freqTemporal/cpdObjetivo).toFixed(2)} °/s`;
  const pxPorCuadro = hz ? freqTemporal*periodoPx/hz : 0;
  $('f-vel').classList.toggle('alerta', hz > 0 && pxPorCuadro > periodoPx/4);  // aliasing temporal
}

function irA(i){
  patron = (i+patrones.length)%patrones.length;
  recalcularPeriodo(); dibujar(); pintarUI();
}
function toggleUI(){ document.querySelectorAll('.ui').forEach(e => e.classList.toggle('oculto')); }

// ---------- Controles ----------
$('ant').onclick = e => { e.stopPropagation(); irA(patron-1); };
$('sig').onclick = e => { e.stopPropagation(); irA(patron+1); };

function pantallaCompleta(){
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } catch (_) {}   // Safari en iPhone no lo admite
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (k==='ArrowRight') irA(patron+1);
  else if (k==='ArrowLeft') irA(patron-1);
  else if (k>='1' && k<='9') irA(Math.min(+k-1, patrones.length-1));
  else if (k==='ArrowUp'){ cpdObjetivo = Math.min(40, +(cpdObjetivo+0.25).toFixed(2)); recalcularPeriodo(); dibujar(); }
  else if (k==='ArrowDown'){ cpdObjetivo = Math.max(0.25, +(cpdObjetivo-0.25).toFixed(2)); recalcularPeriodo(); dibujar(); }
  else if (k==='.') freqTemporal = Math.min(40, +(freqTemporal+0.5).toFixed(1));
  else if (k===',') freqTemporal = Math.max(0, +(freqTemporal-0.5).toFixed(1));
  else if (k===' '){ derivando = !derivando; dibujar(); }
  else if (k==='o'||k==='O'){ vertical = !vertical; dibujar(); }
  else if (k==='h'||k==='H') toggleUI();
  else if (k==='f'||k==='F') pantallaCompleta();
  else return;
  e.preventDefault();
});

let ultimoToque = 0;
lienzo.addEventListener('touchend', () => { ultimoToque = Date.now(); toggleUI(); }, { passive:true });
lienzo.addEventListener('click', () => {
  if (Date.now() - ultimoToque < 600) return;   // clic sintético tras el toque
  toggleUI();
});

function cambioAjuste(){ recalcularPeriodo(); dibujar(); refrescarDatos(); }
['ancho','dist'].forEach(id => $(id).addEventListener('input', cambioAjuste));

let wakeLock = null;
async function mantenerEncendida(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(_){}
}
addEventListener('pointerdown', mantenerEncendida, { once:true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') mantenerEncendida();
});

function redimensionar(){
  const dpr = window.devicePixelRatio || 1;
  W = lienzo.width  = Math.round(innerWidth  * dpr);
  H = lienzo.height = Math.round(innerHeight * dpr);
  ctx.imageSmoothingEnabled = false;
  recalcularPeriodo();
  dibujar();
}
addEventListener('resize', redimensionar);
addEventListener('orientationchange', () => setTimeout(redimensionar, 250));

redimensionar();
pintarUI();
requestAnimationFrame(bucle);
</script>
</body>
</html>
